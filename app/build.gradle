plugins { id 'com.android.application' }

// Release builds are signed with a key kept outside the repository. Point INKHOME_SIGNING at a
// keystore.properties file (storeFile, storePassword, keyAlias, keyPassword); without one,
// release builds fall back to the debug key, which can't update an official install.
def signingProps = new Properties()
def signingFile = file(System.getenv('INKHOME_SIGNING') ?: "${rootDir}/../keys/keystore.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'dev.inkhome'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.inkhome'
        minSdk 30
        targetSdk 35
        versionCode 110
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (signingProps['storeFile']) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
